[project]
name = "fraudguard"
version = "0.1.0"
description = "End-to-end MLOps pipeline for bank account fraud detection"
readme = "README.md"
requires-python = ">=3.11"
# Serving core: everything the inference API needs at runtime so the Docker image installs only these.

dependencies = [
    "boto3>=1.43.0",
    "dill>=0.4.1",
    "fastapi>=0.138.0",
    "from-root>=1.3.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.27.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
# Training/pipeline-only deps. Not installed in the serving image.
training = [
    "onnxmltools>=1.16.0",
    "pandera>=0.32.0",
    "pyarrow>=24.0.0",
    "pymongo[srv]>=4.17.0",
    "sagemaker>=3.0.1",
    "xgboost>=3.2.0",
]
dev = [
    "detect-secrets>=1.5.0",
    "dvc-s3>=3.3.0",
    "matplotlib>=3.11.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.19",
]

[tool.uv]
# Local dev and CI get everything on a plain `uv sync`. The serving image
# opts out with `--no-default-groups` to install just the serving core.
default-groups = ["dev", "training"]
