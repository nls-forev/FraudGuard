model:
  type: XGBClassifier

params:
  objective: "binary:logistic"
  eval_metric: "aucpr"
  tree_method: "hist"

  n_estimators: 1500
  learning_rate: 0.02

  max_depth: 5
  min_child_weight: 20

  subsample: 0.85
  colsample_bytree: 0.75

  gamma: 1.0
  reg_alpha: 0.3
  reg_lambda: 3.0

  scale_pos_weight: 90
  max_bin: 256

  random_state: 42
  n_jobs: -1
