name: Continuous Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login AWS
        run: aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 719201730313.dkr.ecr.ap-south-1.amazonaws.com

      - name: Push docker image to ECR
        run: |
          docker build -t fraudguard .
          docker tag fraudguard:latest 719201730313.dkr.ecr.ap-south-1.amazonaws.com/fraudguard:latest
          docker push 719201730313.dkr.ecr.ap-south-1.amazonaws.com/fraudguard:latest

      - name: Update service in cluster for Deployment
        run: |
          aws ecs update-service --cluster fraudguard-cluster \
            --service fraudguard-service --force-new-deployment
